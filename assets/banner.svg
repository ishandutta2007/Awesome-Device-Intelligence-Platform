<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)" rx="16"/>

  <!-- Subtle Dynamic/Animated Background Elements (Behind text & foreground) -->
  <g opacity="0.6">
    <circle cx="200" cy="160" r="180" fill="url(#glow)">
      <animate attributeName="r" values="160;200;160" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="1000" cy="160" r="220" fill="url(#glow)">
      <animate attributeName="r" values="220;180;220" dur="10s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Animated Pulse Rings (Tech Grid lines) -->
  <g stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1.5" fill="none">
    <circle cx="600" cy="160" r="100">
      <animate attributeName="r" values="80;220;80" dur="6s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values="0.3;0;0.3" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="160" r="150">
      <animate attributeName="r" values="130;270;130" dur="8s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values="0.25;0;0.25" dur="8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Floating Dynamic Tech Signals (Background Layer) -->
  <g fill="#38bdf8" opacity="0.4">
    <circle cx="150" cy="80" r="3">
      <animate attributeName="cy" values="80;70;80" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="240" r="4">
      <animate attributeName="cy" values="240;250;240" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="70" r="3.5">
      <animate attributeName="cy" values="70;60;70" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="250" r="3">
      <animate attributeName="cy" values="250;240;250" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Foreground Title and Subtitle (Ensured to remain sharp and unobscured) -->
  <g text-anchor="middle" filter="url(#shadow)">
    <!-- Main Title -->
    <text x="600" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="44" fill="url(#textGrad)" letter-spacing="0.5">
      Awesome Device Intelligence Platform 🛡️
    </text>

    <!-- Subtitle -->
    <text x="600" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="20" fill="#94a3b8" letter-spacing="0.2">
      Curated Ecosystem for Device Fingerprinting, Bot Detection &amp; Fraud Signal Enrichment
    </text>

    <!-- Decorative Pill Badges (Foreground) -->
    <g transform="translate(340, 220)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="160" height="34" rx="17" fill="url(#accentGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
      <text x="80" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">🔍 Fingerprinting</text>

      <!-- Pill 2 -->
      <rect x="180" y="0" width="160" height="34" rx="17" fill="url(#accentGrad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1"/>
      <text x="260" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#818cf8" text-anchor="middle">🤖 Bot Prevention</text>

      <!-- Pill 3 -->
      <rect x="360" y="0" width="160" height="34" rx="17" fill="url(#accentGrad)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1"/>
      <text x="440" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#c084fc" text-anchor="middle">⚡ Fraud Detection</text>
    </g>
  </g>
</svg>
